<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sitka Skies Channel" />
    <meta name="theme-color" content="#000000" />
    <title>Sitka Skies Channel — Always On</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <link rel="stylesheet" href="/css/main.css" />
    <!--
    Security: this page is fully self-contained, no user data, no tracking.
    All footage is synthetic — generated from public terrain data and the
    motion tile library. No camera, microphone, GPS, or personal data.
    No analytics, no tracking pixels, no external scripts beyond the
    Three.js CDN (same as /fly/).
  -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
          "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/",
          "three-tile": "./vendor/three-tile/packages/lib/dist/three-tile-osf.js",
          "stats.js": "https://esm.sh/stats.js@0.17.0"
        }
      }
    </script>
    <style>
      #channel-overlay {
        position: fixed;
        bottom: env(safe-area-inset-bottom, 12px);
        left: 12px;
        z-index: 100;
        color: rgba(255, 255, 255, 0.85);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1.5;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
        pointer-events: none;
      }
      #channel-overlay .channel-title {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.1em;
        color: #7df9ff;
      }
      #channel-overlay .live-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #ff4444;
        margin-right: 6px;
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="boot-overlay">
      <div class="boot-inner">
        <div class="boot-title">SITKA SKIES CHANNEL</div>
        <div class="boot-status" id="boot-status">Loading Sitka…</div>
        <div class="boot-error" id="boot-error" style="display: none"></div>
      </div>
    </div>
    <div id="channel-overlay">
      <div class="channel-title"><span class="live-dot"></span>SITKA SKIES CHANNEL</div>
      <div id="now-playing">Now playing: —</div>
      <div id="seq-count">Generated 0 sequences</div>
    </div>
    <script type="module" src="/js/channel.js"></script>
  </body>
</html>
